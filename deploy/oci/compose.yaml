services:
  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    volumes:
      - linkplan-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  linkplan-data:
