server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    location /api/ { proxy_pass http://backend:8080; proxy_read_timeout 120s; }
    location /swagger { proxy_pass http://backend:8080; }
    location / { try_files $uri $uri/ /index.html; }
}
