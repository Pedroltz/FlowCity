name: CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    name: Validate frontend and API
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Restore API and test dependencies
        run: dotnet restore backend/FlowCity.sln

      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run API tests
        run: dotnet test backend/FlowCity.sln --configuration Release --no-restore

  deploy:
    name: Build image and deploy to Render
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: Bruno23111
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and publish application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/render/Dockerfile
          push: true
          tags: |
            ghcr.io/bruno23111/linkplan:${{ github.sha }}
            ghcr.io/bruno23111/linkplan:latest

      - name: Install Render CLI
        run: |
          curl -fsSL https://github.com/render-oss/cli/releases/download/v2.36.0/cli_2.36.0_linux_amd64.zip -o /tmp/render-cli.zip
          unzip -q /tmp/render-cli.zip -d /tmp/render-cli
          install /tmp/render-cli/cli_v2.36.0 /usr/local/bin/render

      - name: Deploy image to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          DO_NOT_TRACK: "1"
        run: >-
          render deploys create srv-dbtlov8n74is73dqpveg
          --image ghcr.io/bruno23111/linkplan:${{ github.sha }}
          --wait --confirm --output json
