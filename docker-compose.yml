services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5080:8080"
    volumes:
      - flowcity-data:/data
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  flowcity-data:
