<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>LinkPlan • Planejamento de redes</title>
    <script>
      (() => {
        let preference = "system";
        try {
          preference = localStorage.getItem("linkplan-theme") || "system";
        } catch {}
        const dark =
          preference === "dark" ||
          (preference !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
